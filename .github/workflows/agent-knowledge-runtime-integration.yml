name: Agent Knowledge Runtime Integration
on:
  pull_request:
    branches: [main]
    paths: ['apps/api/**','db/migrations/**','scripts/**','tests/**','package.json','.github/workflows/agent-knowledge-runtime-integration.yml']
jobs:
  agent-knowledge-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cervel, POSTGRES_PASSWORD: cervel, POSTGRES_DB: cervel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cervel -d cervel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cervel:cervel@localhost:5432/cervel
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: cervel
      S3_ACCESS_KEY_ID: cervel
      S3_SECRET_ACCESS_KEY: change-me-now
      CERVEL_NODE_AUTHORITY: local
      CERVEL_NODE_NAME: CERVEL CI Node
      CERVEL_BOOTSTRAP_ADMIN_SUBJECT: ci-admin
      CERVEL_ALLOW_ALPHA_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate
      - run: npm run --silent db:bootstrap > /tmp/bootstrap.json
      - name: Validate agent runtime schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT principal_id,kind,capabilities FROM agent_identities LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT permissions FROM agent_workspace_grants LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT observation,created_claim_id FROM agent_observations LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT watch_id,event_types,impact_kinds,cursor_at FROM agent_subscriptions LIMIT 0;"
      - name: Validate durable permission-aware agent loop
        run: |
          NODE_ID=$(jq -r .nodeId /tmp/bootstrap.json)
          WORKSPACE_ID=$(jq -r .workspaceId /tmp/bootstrap.json)
          PRINCIPAL_ID=$(jq -r .principalId /tmp/bootstrap.json)
          npx tsx scripts/validate-agent-runtime.ts "$NODE_ID" "$WORKSPACE_ID" "$PRINCIPAL_ID" | tee /tmp/agent-result.json
          jq -e '.tenant_blocked == true' /tmp/agent-result.json >/dev/null
          jq -e '.subject_blocked == true' /tmp/agent-result.json >/dev/null
          jq -e '.claim_id != null and .claim_status == "claimed"' /tmp/agent-result.json >/dev/null
          jq -e '.claim_agent_id == .agent_id' /tmp/agent-result.json >/dev/null
          jq -e '.context_id != null' /tmp/agent-result.json >/dev/null
      - name: Validate runtime contracts
        run: |
          grep -q 'registerAgentRoutes' apps/api/src/server.ts
          grep -q 'assembleContextPackage' apps/api/src/agent-runtime.ts
          grep -q 'watch_alerts' apps/api/src/agent-runtime.ts
          grep -q 'knowledge_events' apps/api/src/agent-runtime.ts
          grep -q 'knowledge_event_impacts' apps/api/src/agent-runtime.ts
          grep -q 'AGENT_WATCH_PERMISSION_DENIED' apps/api/src/agent-runtime.ts
