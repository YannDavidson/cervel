name: CKEP Event Runtime Integration
on:
  pull_request:
    branches: [main]
jobs:
  ckep-event-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cervel, POSTGRES_PASSWORD: cervel, POSTGRES_DB: cervel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cervel -d cervel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cervel:cervel@localhost:5432/cervel
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: cervel
      S3_ACCESS_KEY_ID: cervel
      S3_SECRET_ACCESS_KEY: change-me-now
      CERVEL_NODE_AUTHORITY: local
      CERVEL_NODE_NAME: CERVEL CI Node
      CERVEL_BOOTSTRAP_ADMIN_SUBJECT: ci-admin
      CERVEL_ALLOW_ALPHA_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate
      - run: npm run --silent db:bootstrap > /tmp/bootstrap.json
      - name: Validate CKEP runtime schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT event_uri,sequence,idempotency_key,envelope_hash,envelope FROM ckep_event_journal LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT event_types,subject_types,subject_uris,cursor_sequence FROM ckep_subscriptions LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT subscription_id,journal_event_id,acknowledged_at FROM ckep_delivery_receipts LIMIT 0;"
      - name: Validate append publish replay query subscriptions
        run: |
          NODE_ID=$(jq -r .nodeId /tmp/bootstrap.json)
          WORKSPACE_ID=$(jq -r .workspaceId /tmp/bootstrap.json)
          PRINCIPAL_ID=$(jq -r .principalId /tmp/bootstrap.json)
          npx tsx scripts/validate-ckep-event-runtime.ts "$NODE_ID" "$WORKSPACE_ID" "$PRINCIPAL_ID" | tee /tmp/runtime.json
          jq -e '.first_created == true and .duplicate_idempotent == true and .publish_bridge == true' /tmp/runtime.json >/dev/null
          jq -e '.sequence_blocked == true and .workspace_blocked == true and .immutable == true' /tmp/runtime.json >/dev/null
          jq -e '.query_count == 2 and .replay_count == 2 and .delivered_count == 2 and .replay_safe == true and .receipt_count == 2' /tmp/runtime.json >/dev/null
          jq -e '.sequences == [1,2]' /tmp/runtime.json >/dev/null
      - name: Validate runtime contracts
        run: |
          grep -q 'appendCkepEvent' apps/api/src/ckep-runtime.ts
          grep -q 'publishKnowledgeEventAsCkep' apps/api/src/ckep-runtime.ts
          grep -q '/v1/ckep/replay' apps/api/src/ckep-routes.ts
          grep -q '/v1/ckep/publish/' apps/api/src/ckep-routes.ts
          grep -q 'CKEP_PREVIOUS_EVENT_MISMATCH' apps/api/src/ckep-runtime.ts
          grep -q 'CKEP_EVENT_JOURNAL_IMMUTABLE' db/migrations/022_ckep_event_runtime.sql
          grep -q 'registerCkepRoutes' apps/api/src/evolution-routes.ts
