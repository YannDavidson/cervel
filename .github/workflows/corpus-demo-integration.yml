name: CERVEL Life + Enterprise Corpus Demo
on:
  pull_request:
    branches: [main]
jobs:
  corpus-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:corpus-demo -- --runInBand
      - run: npm run test:demo -- --runInBand
