name: Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-contract.ts'
      - '.github/workflows/dependency-security.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-contract.ts'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for dependency remediation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export regenerated lockfile
        uses: actions/upload-artifact@v5
        with:
          name: pr-75-regenerated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Install with regenerated locked dependency graph
        run: npm ci
      - name: Verify pinned security contract
        run: npm run test:dependency-security
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Build regression
        run: npm run build
      - name: Targeted desktop regression
        run: npm run test:desktop -- --runInBand
