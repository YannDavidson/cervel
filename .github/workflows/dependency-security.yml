name: Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-contract.ts'
      - '.github/workflows/dependency-security.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-contract.ts'
      - '.github/workflows/dependency-security.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Regenerate lockfile for dependency remediation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already synchronized.'
            exit 0
          fi
          git config user.name 'Yann Davidson'
          git config user.email '30988886+YannDavidson@users.noreply.github.com'
          git add package-lock.json
          git commit -s -m 'fix: lock patched dependency graph'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Install with locked dependency graph
        run: npm ci
      - name: Verify pinned security contract
        run: npm run test:dependency-security
      - name: Audit full dependency graph
        run: npm audit --audit-level=high
      - name: Audit production dependency graph
        run: npm audit --omit=dev --audit-level=high
      - name: Build regression
        run: npm run build
      - name: Targeted desktop regression
        run: npm run test:desktop -- --runInBand
