name: Deploy CERVEL Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provision:
        description: Ensure staging infrastructure exists before deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  DEPLOY_PHASE: start

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Publish deployment pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"cervel/staging-deploy","description":"CERVEL staging deployment running"}' >/dev/null

      - name: Validate GitHub staging variables
        run: |
          echo 'DEPLOY_PHASE=variables' >> "$GITHUB_ENV"
          test -n "$GCP_PROJECT_ID" || { echo 'Missing repository/environment variable GCP_PROJECT_ID'; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo 'Missing GCP_WORKLOAD_IDENTITY_PROVIDER'; exit 1; }
          test -n "$GCP_DEPLOYER_SERVICE_ACCOUNT" || { echo 'Missing GCP_DEPLOYER_SERVICE_ACCOUNT'; exit 1; }

      - name: Mark authentication phase
        run: echo 'DEPLOY_PHASE=wif-auth' >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Provision staging infrastructure
        if: ${{ github.event_name == 'push' || inputs.provision }}
        run: |
          echo 'DEPLOY_PHASE=provision' >> "$GITHUB_ENV"
          bash infra/gcp/staging/provision.sh | tee /tmp/cervel-staging-infra.env

      - name: Resolve staging infrastructure
        run: |
          echo 'DEPLOY_PHASE=resolve-infra' >> "$GITHUB_ENV"
          if [ ! -f /tmp/cervel-staging-infra.env ]; then bash infra/gcp/staging/provision.sh > /tmp/cervel-staging-infra.env; fi
          cat /tmp/cervel-staging-infra.env >> "$GITHUB_ENV"

      - name: Build and push immutable image
        run: |
          echo 'DEPLOY_PHASE=image-auth' >> "$GITHUB_ENV"
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          IMAGE_URI="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${CERVEL_STAGING_ARTIFACT_REPO}/cervel:${GITHUB_SHA}"
          echo 'DEPLOY_PHASE=image-build' >> "$GITHUB_ENV"
          docker build --pull -t "$IMAGE_URI" .
          echo 'DEPLOY_PHASE=image-push' >> "$GITHUB_ENV"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy database, service and jobs
        run: |
          echo 'DEPLOY_PHASE=deploy-runtime' >> "$GITHUB_ENV"
          bash infra/gcp/staging/deploy.sh | tee /tmp/cervel-staging-deploy.env

      - name: Resolve deployment outputs
        run: |
          echo 'DEPLOY_PHASE=resolve-deploy' >> "$GITHUB_ENV"
          cat /tmp/cervel-staging-deploy.env >> "$GITHUB_ENV"
          grep '^CERVEL_STAGING_URL=' /tmp/cervel-staging-deploy.env

      - name: Live smoke validation
        run: |
          echo 'DEPLOY_PHASE=smoke' >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$CERVEL_STAGING_URL/live" | tee /tmp/live.json
          curl --fail --silent --show-error "$CERVEL_STAGING_URL/ready" | tee /tmp/ready.json
          jq -e '.ok == true' /tmp/live.json >/dev/null
          jq -e '.ok == true and .database == true and .mode == "staging"' /tmp/ready.json >/dev/null

      - name: Run recovery jobs once
        run: |
          echo 'DEPLOY_PHASE=recovery-jobs' >> "$GITHUB_ENV"
          gcloud run jobs execute cervel-staging-source-sync --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet
          gcloud run jobs execute cervel-staging-ckep-drain --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Publish staging summary
        run: |
          echo 'DEPLOY_PHASE=summary' >> "$GITHUB_ENV"
          {
            echo '## CERVEL Staging'
            echo "- URL: $CERVEL_STAGING_URL"
            echo "- Image: $IMAGE_URI"
            echo "- Node: $CERVEL_NODE_ID"
            echo "- Workspace: $CERVEL_WORKSPACE_ID"
            echo "- Google OIDC callback: $GOOGLE_OIDC_CALLBACK"
            echo "- Google Drive callback: $GOOGLE_DRIVE_CALLBACK"
            echo "- Dropbox callback: $DROPBOX_CALLBACK"
            echo "- OneDrive callback: $ONEDRIVE_CALLBACK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status }}
        run: |
          if [ "$DEPLOY_STATE" = success ]; then
            state=success
            context='cervel/staging-deploy'
            description='CERVEL staging deployment succeeded'
          else
            state=failure
            context="cervel/staging-failure/${DEPLOY_PHASE}"
            description="CERVEL staging failed during ${DEPLOY_PHASE}"
          fi
          payload="$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$payload" >/dev/null
