name: Deploy CERVEL Staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provision:
        description: Ensure staging infrastructure exists before deploying
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  statuses: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  DEPLOY_PHASE: start

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Publish deployment pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload="$(jq -nc --arg target_url "$target_url" '{state:"pending",context:"cervel/staging-deploy",description:"CERVEL staging deployment running",target_url:$target_url}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null

      - name: Validate GitHub staging variables
        run: |
          echo 'DEPLOY_PHASE=variables' >> "$GITHUB_ENV"
          test -n "$GCP_PROJECT_ID"
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER"
          test -n "$GCP_DEPLOYER_SERVICE_ACCOUNT"

      - name: Mark authentication phase
        run: echo 'DEPLOY_PHASE=wif-auth' >> "$GITHUB_ENV"
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Provision staging infrastructure
        if: ${{ github.event_name == 'push' || inputs.provision }}
        run: |
          set -o pipefail
          echo 'DEPLOY_PHASE=provision' >> "$GITHUB_ENV"
          bash infra/gcp/staging/provision.sh | tee /tmp/cervel-staging-infra.env

      - name: Resolve staging infrastructure
        run: |
          echo 'DEPLOY_PHASE=resolve-infra' >> "$GITHUB_ENV"
          if [ ! -s /tmp/cervel-staging-infra.env ]; then bash infra/gcp/staging/provision.sh > /tmp/cervel-staging-infra.env; fi
          allowed='^(GCP_PROJECT_ID|GCP_REGION|CLOUD_SQL_INSTANCE|CLOUD_SQL_CONNECTION_NAME|CERVEL_STAGING_BUCKET|CERVEL_STAGING_RUNTIME_SA|CERVEL_STAGING_ARTIFACT_REPO)='
          grep -E "$allowed" /tmp/cervel-staging-infra.env > /tmp/cervel-staging-infra.clean
          test "$(wc -l < /tmp/cervel-staging-infra.clean)" -eq 7
          cat /tmp/cervel-staging-infra.clean >> "$GITHUB_ENV"

      - name: Build and push immutable image
        run: |
          test -n "$CERVEL_STAGING_ARTIFACT_REPO"
          REGISTRY="${GCP_REGION}-docker.pkg.dev"
          echo 'DEPLOY_PHASE=image-auth' >> "$GITHUB_ENV"
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${REGISTRY}"
          IMAGE_URI="${REGISTRY}/${GCP_PROJECT_ID}/${CERVEL_STAGING_ARTIFACT_REPO}/cervel:${GITHUB_SHA}"
          echo 'DEPLOY_PHASE=image-build' >> "$GITHUB_ENV"
          docker build -t "$IMAGE_URI" .
          echo 'DEPLOY_PHASE=image-push' >> "$GITHUB_ENV"
          docker push "$IMAGE_URI"
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Deploy database, service and jobs
        run: |
          set -o pipefail
          echo 'DEPLOY_PHASE=deploy-runtime' >> "$GITHUB_ENV"
          bash infra/gcp/staging/deploy.sh | tee /tmp/cervel-staging-deploy.env

      - name: Resolve deployment outputs
        run: |
          echo 'DEPLOY_PHASE=resolve-deploy' >> "$GITHUB_ENV"
          allowed='^(CERVEL_STAGING_URL|CERVEL_NODE_ID|CERVEL_WORKSPACE_ID|GOOGLE_OIDC_CALLBACK|GOOGLE_DRIVE_CALLBACK|DROPBOX_CALLBACK|ONEDRIVE_CALLBACK)='
          grep -E "$allowed" /tmp/cervel-staging-deploy.env > /tmp/cervel-staging-env.clean
          test "$(wc -l < /tmp/cervel-staging-env.clean)" -eq 7
          cat /tmp/cervel-staging-env.clean >> "$GITHUB_ENV"
          grep -q '^CERVEL_STAGING_URL=https://' /tmp/cervel-staging-env.clean

      - name: Live smoke validation
        run: |
          echo 'DEPLOY_PHASE=smoke' >> "$GITHUB_ENV"
          curl --fail --silent --show-error "$CERVEL_STAGING_URL/live" | tee /tmp/live.json
          curl --fail --silent --show-error "$CERVEL_STAGING_URL/ready" | tee /tmp/ready.json
          jq -e '.ok == true' /tmp/live.json >/dev/null
          jq -e '.ok == true and .database == true and .mode == "staging"' /tmp/ready.json >/dev/null

      - name: Run recovery jobs once
        run: |
          set -o pipefail
          run_recovery_job() {
            local job="$1" phase="$2" log="/tmp/${job}-execute.log" execution
            echo "DEPLOY_PHASE=${phase}" >> "$GITHUB_ENV"
            if ! gcloud run jobs execute "$job" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet 2>&1 | tee "$log"; then
              execution="$(sed -n 's/.*Execution \[\([^]]*\)\].*/\1/p; s/.*executions describe \([^ ]*\).*/\1/p' "$log" | tail -1)"
              if [ -n "$execution" ]; then
                gcloud run jobs executions describe "$execution" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=yaml || true
                gcloud logging read "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${job}\" AND labels.\"run.googleapis.com/execution_name\"=\"${execution}\"" --project "$GCP_PROJECT_ID" --freshness=30m --limit=100 --order=asc --format='value(timestamp,severity,textPayload,jsonPayload)' || true
              fi
              exit 1
            fi
          }
          run_recovery_job cervel-staging-source-sync source-sync-job-execute
          run_recovery_job cervel-staging-ckep-drain ckep-drain-job-execute

      - name: Publish staging summary
        run: |
          echo 'DEPLOY_PHASE=summary' >> "$GITHUB_ENV"
          {
            echo '## CERVEL Staging'
            echo "- URL: $CERVEL_STAGING_URL"
            echo "- Image: $IMAGE_URI"
            echo "- Node: $CERVEL_NODE_ID"
            echo "- Workspace: $CERVEL_WORKSPACE_ID"
            echo "- Google OIDC callback: $GOOGLE_OIDC_CALLBACK"
            echo "- Google Drive callback: $GOOGLE_DRIVE_CALLBACK"
            echo "- Dropbox callback: $DROPBOX_CALLBACK"
            echo "- OneDrive callback: $ONEDRIVE_CALLBACK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish deployment commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status }}
        run: |
          target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$DEPLOY_STATE" = success ]; then state=success; context='cervel/staging-deploy'; description='CERVEL staging deployment succeeded'; else state=failure; context="cervel/staging-failure/${DEPLOY_PHASE}"; description="CERVEL staging failed during ${DEPLOY_PHASE}"; fi
          payload="$(jq -nc --arg state "$state" --arg context "$context" --arg description "$description" --arg target_url "$target_url" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
