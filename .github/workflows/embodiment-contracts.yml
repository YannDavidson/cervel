name: CERVEL Mobile + Extension Experience Contracts

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'apps/capture-extension/**'
      - 'packages/shared-experience/**'
      - 'tests/embodiment-contracts/**'
      - 'docs/MOBILE_EXTENSION_EXPERIENCE_CONTRACTS.md'
      - '.github/workflows/embodiment-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - name: Mobile and extension experience contracts
        run: npx jest tests/embodiment-contracts --runInBand
      - name: TypeScript build
        run: npm run build
