name: External AI Agent Gateway
on:
  pull_request:
    paths:
      - "packages/external-gateway/**"
      - "apps/mcp-server/**"
      - "apps/api/src/external-gateway-routes.ts"
      - "db/migrations/030_external_ai_agent_gateway.sql"
      - "tests/external-gateway/**"
      - ".github/workflows/external-gateway-integration.yml"
  push:
    branches: [main]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:external-gateway
