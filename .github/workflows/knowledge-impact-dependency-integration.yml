name: Knowledge Impact Dependency Integration
on:
  pull_request:
    branches: [main]
    paths: ['apps/api/**','db/migrations/**','tests/**','package.json','.github/workflows/knowledge-impact-dependency-integration.yml']
jobs:
  knowledge-impact-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cervel, POSTGRES_PASSWORD: cervel, POSTGRES_DB: cervel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cervel -d cervel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cervel:cervel@localhost:5432/cervel
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: cervel
      S3_ACCESS_KEY_ID: cervel
      S3_SECRET_ACCESS_KEY: change-me-now
      CERVEL_NODE_AUTHORITY: local
      CERVEL_NODE_NAME: CERVEL CI Node
      CERVEL_BOOTSTRAP_ADMIN_SUBJECT: ci-admin
      CERVEL_ALLOW_ALPHA_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate
      - run: npm run --silent db:bootstrap > /tmp/bootstrap.json
      - name: Validate dependency and impact schema
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT source_type,source_id,relation,target_type,target_id,confidence,strength FROM knowledge_dependencies LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT event_id,root_type,root_id,max_depth,confidence_floor,status FROM impact_propagation_runs LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT impacted_type,impacted_id,depth,path,confidence,impact_kind FROM impact_paths LIMIT 0;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT propagation_run_id,depth,path FROM knowledge_event_impacts LIMIT 0;"
      - name: Validate impact runtime contracts
        run: |
          grep -q "depends_on" apps/api/src/impact-engine.ts
          grep -q "derived_from" apps/api/src/impact-engine.ts
          grep -q "supports" apps/api/src/impact-engine.ts
          grep -q "contradicts" apps/api/src/impact-engine.ts
          grep -q "supersedes" apps/api/src/impact-engine.ts
          grep -q "affected_by" apps/api/src/impact-engine.ts
          grep -q "propagateKnowledgeImpact" apps/api/src/knowledge-evolution.ts
          grep -q "/v1/impact/:eventId" apps/api/src/impact-routes.ts
