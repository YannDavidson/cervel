name: Knowledge Intelligence Workspace Integration
on:
  pull_request:
    branches: [main]
jobs:
  knowledge-intelligence-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: cervel, POSTGRES_PASSWORD: cervel, POSTGRES_DB: cervel }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cervel -d cervel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://cervel:cervel@localhost:5432/cervel
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: cervel
      S3_ACCESS_KEY_ID: cervel
      S3_SECRET_ACCESS_KEY: change-me-now
      CERVEL_NODE_AUTHORITY: local
      CERVEL_NODE_NAME: CERVEL CI Node
      CERVEL_BOOTSTRAP_ADMIN_SUBJECT: ci-admin
      CERVEL_ALLOW_ALPHA_LOGIN: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate
      - run: npm run --silent db:bootstrap > /tmp/bootstrap.json
      - name: Validate product intelligence workspace
        run: |
          NODE_ID=$(jq -r .nodeId /tmp/bootstrap.json)
          WORKSPACE_ID=$(jq -r .workspaceId /tmp/bootstrap.json)
          PRINCIPAL_ID=$(jq -r .principalId /tmp/bootstrap.json)
          npx tsx scripts/validate-knowledge-intelligence-workspace.ts "$NODE_ID" "$WORKSPACE_ID" "$PRINCIPAL_ID" | tee /tmp/kiw-result.json
          jq -e '.ui_complete == true and .local_complete == true and .workspace_isolated == true' /tmp/kiw-result.json >/dev/null
          jq -e '.views.timeline > 0 and .views.changes > 0 and .views.claims > 0 and .views.decisions > 0 and .views.contradictions > 0 and .views.sources > 0 and .views.health > 0 and .views.agents > 0' /tmp/kiw-result.json >/dev/null
      - name: Validate product contracts
        run: |
          grep -q 'renderKnowledgeIntelligenceWorkspace' apps/api/src/workspace-routes.ts
          grep -q '/v1/workspace/intelligence' apps/api/src/workspace-routes.ts
          grep -q 'Ask CERVEL' apps/web/src/intelligence-workspace-ui.ts
          grep -q 'Knowledge Graph' apps/web/src/intelligence-workspace-ui.ts
          grep -q 'Contradictions' apps/web/src/intelligence-workspace-ui.ts
