name: Vendor approved CERVEL brand asset

on:
  push:
    branches: [feat/pr-78-design-system-application-shell]
    paths:
      - '.github/workflows/vendor-cervel-brand-asset.yml'

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/pr-78-design-system-application-shell
      - name: Fetch exact approved logo and verify digest
        shell: bash
        run: |
          set -euo pipefail
          asset='packages/shared-experience/assets/brand/cervel-mark.png'
          mkdir -p "$(dirname "$asset")"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$asset" \
            'https://i.postimg.cc/3JTRqdvz/Chat-GPT-Image-Aug-24-2026-04-48-31-PM.png'
          test "$(wc -c < "$asset" | tr -d ' ')" = '852781'
          printf '%s  %s\n' '18dc78ba39e85b0db6a27c107e86382f42f8e4d67f41e1a3afbadebbbaed0f13' "$asset" | sha256sum --check --strict
      - name: Commit vendored asset and remove one-time bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/shared-experience/assets/brand/cervel-mark.png
          git rm .github/workflows/vendor-cervel-brand-asset.yml
          git commit -m 'PR #78: vendor approved CERVEL logo asset'
          git push origin HEAD:feat/pr-78-design-system-application-shell
