name: Workspace Alpha Integration
on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'db/migrations/**'
      - 'tests/**'
      - '.github/workflows/workspace-alpha-integration.yml'
jobs:
  workspace-alpha:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cervel
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cervel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: npm run db:migrate
      - name: Verify Workspace Alpha schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT token_hash, expires_at, revoked_at FROM workspace_sessions LIMIT 0;"
