[package]
name = "cervel-desktop"
version = "0.1.0"
description = "CERVEL Persistent Knowledge Infrastructure desktop embodiment"
authors = ["CSIX AI LABS LLC"]
edition = "2021"

[lib]
name = "cervel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
