services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cervel
      POSTGRES_PASSWORD: cervel
      POSTGRES_DB: cervel
    ports:
      - "5432:5432"
    volumes:
      - cervel_pg:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cervel
      MINIO_ROOT_PASSWORD: change-me-now
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cervel_minio:/data

volumes:
  cervel_pg:
  cervel_minio:
